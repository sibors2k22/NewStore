<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operación - NewStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#F3F4F6', 
                        cardBg: '#FFFFFF', 
                        primary: '#2563EB', 
                        success: '#16A34A', 
                        textMain: '#1F2937',
                        textMuted: '#6B7280'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-appBg text-textMain font-sans antialiased pb-24">

    <header class="bg-cardBg shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Operación</h1>
            <span class="text-xs font-semibold bg-gray-100 text-textMuted px-2 py-1 rounded">Admin</span>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6 mb-4 flex bg-gray-200 p-1 rounded-lg">
        <button onclick="cambiarPestaña('ordenes')" id="btn-ordenes" class="flex-1 py-2 bg-white text-primary font-semibold rounded shadow-sm text-sm transition">Órdenes</button>
        <button onclick="cambiarPestaña('productos')" id="btn-productos" class="flex-1 py-2 text-textMuted font-semibold rounded text-sm transition">Catálogo</button>
    </div>

    <main class="max-w-md mx-auto px-4">
        
        <div id="tab-ordenes" class="space-y-4 block">
            <div class="bg-cardBg rounded-xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-textMuted uppercase tracking-wider">Ventas de Hoy</p>
                    <p class="text-2xl font-bold text-success mt-1">$0.00</p>
                </div>
                <div class="text-right">
                    <p class="text-xs font-semibold text-textMuted uppercase tracking-wider">Pendientes</p>
                    <p id="orders-count-badge" class="text-xl font-bold text-primary mt-1">0 Órdenes</p>
                </div>
            </div>

            <p class="text-sm font-semibold text-textMuted mt-6 mb-2">POR REVISAR</p>
            <div id="orders-container" class="space-y-4">
                <p class="text-sm text-textMuted text-center py-4 bg-cardBg rounded-xl border border-dashed border-gray-300">No hay órdenes pendientes por el momento.</p>
            </div>
        </div>

        <div id="tab-productos" class="space-y-4 hidden">
            
            <button onclick="toggleFormulario(true)" id="btn-abrir-formulario" class="w-full py-3 bg-primary text-white font-semibold rounded-xl shadow-sm flex justify-center items-center gap-2 transition hover:bg-blue-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Registrar Nuevo Producto
            </button>

            <div id="form-producto-container" class="bg-cardBg rounded-xl p-4 shadow-sm border border-gray-100 hidden space-y-4">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 class="font-bold text-textMain text-base">Nuevo Producto</h3>
                    <button onclick="toggleFormulario(false)" class="text-textMuted text-sm font-medium hover:text-textMain">Cancelar</button>
                </div>
                
                <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-textMuted uppercase mb-1">Nombre del Producto</label>
                        <input type="text" id="prod-nombre" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-1 focus:ring-primary focus:outline-none" placeholder="Ej. Playera Tipo Polo Coccole">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-textMuted uppercase mb-1">Precio ($)</label>
                            <input type="number" id="prod-precio" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-1 focus:ring-primary focus:outline-none" placeholder="0.00">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-textMuted uppercase mb-1">Stock Inicial</label>
                            <input type="number" id="prod-stock" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-1 focus:ring-primary focus:outline-none" placeholder="0">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-textMuted uppercase mb-1">Descripción (Opcional)</label>
                        <textarea id="prod-descripcion" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-1 focus:ring-primary focus:outline-none" placeholder="Detalles, color, material..."></textarea>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-success text-white font-semibold rounded-lg text-sm shadow-sm hover:bg-emerald-600 transition mt-2">
                        Guardar en Base de Datos
                    </button>
                </form>
            </div>

            <p class="text-sm font-semibold text-textMuted mt-6 mb-2">INVENTARIO ACTUAL</p>
            
            <div id="products-container" class="space-y-3">
                <p class="text-sm text-textMuted text-center py-8">Cargando inventario...</p>
            </div>
        </div>
    </main>

    <script>
        // Cambiar entre pestañas de Operación
        function cambiarPestaña(pestaña) {
            document.getElementById('tab-ordenes').classList.add('hidden');
            document.getElementById('tab-productos').classList.add('hidden');
            
            document.getElementById('btn-ordenes').className = "flex-1 py-2 text-textMuted font-semibold rounded text-sm transition";
            document.getElementById('btn-productos').className = "flex-1 py-2 text-textMuted font-semibold rounded text-sm transition";
            
            document.getElementById('tab-' + pestaña).classList.remove('hidden');
            document.getElementById('btn-' + pestaña).className = "flex-1 py-2 bg-white text-primary font-semibold rounded shadow-sm text-sm transition";
            
            if (pestaña === 'productos') {
                cargarProductos();
            }
        }

        // Mostrar u ocultar el formulario de registro
        function toggleFormulario(visible) {
            const formContainer = document.getElementById('form-producto-container');
            const btnAbrir = document.getElementById('btn-abrir-formulario');
            if (visible) {
                formContainer.classList.remove('hidden');
                btnAbrir.classList.add('hidden');
            } else {
                formContainer.classList.add('hidden');
                btnAbrir.classList.remove('hidden');
                document.getElementById('form-producto').reset();
            }
        }

        // API FETCH: Obtener y renderizar los productos reales
        async function cargarProductos() {
            const container = document.getElementById('products-container');
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                
                if (productos.length === 0) {
                    container.innerHTML = `<p class="text-sm text-textMuted text-center py-6 bg-cardBg rounded-xl border border-dashed border-gray-300">No hay productos registrados aún.</p>`;
                    return;
                }
                
                container.innerHTML = ''; // Limpiar cargando
                
                productos.forEach(p => {
                    // Tomamos el precio y stock de su primera variante básica
                    const variantePrincipal = p.variantes && p.variantes[0] ? p.variantes[0] : { precio: 0, stock: 0 };
                    
                    const card = document.createElement('div');
                    card.className = "bg-cardBg rounded-xl p-3 shadow-sm border border-gray-100 flex gap-4 items-center";
                    card.innerHTML = `
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex-shrink-0 border border-gray-200 flex items-center justify-center text-textMuted font-bold text-xs uppercase">
                            ${p.nombre.substring(0,2)}
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-textMain text-sm">${p.nombre}</h3>
                            <p class="text-sm text-primary font-bold">$${parseFloat(variantePrincipal.precio).toFixed(2)}</p>
                            <p class="text-xs text-textMuted mt-0.5">Stock disponible: ${variantePrincipal.stock}</p>
                        </div>
                        <div class="text-xs font-semibold ${p.activo ? 'text-success bg-green-50' : 'text-red-500 bg-red-50'} px-2 py-1 rounded">
                            ${p.activo ? 'Activo' : 'Inactivo'}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-sm text-red-500 text-center py-4">Error al conectar con el servidor.</p>`;
            }
        }

        // API FETCH: Enviar el formulario a la base de datos
        async function guardarProducto(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);
            const stock = parseInt(document.getElementById('prod-stock').value);
            const descripcion = document.getElementById('prod-descripcion').value;

            try {
                const response = await fetch('/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, precio, stock, descripcion })
                });

                const result = await response.json();
                if (result.success) {
                    toggleFormulario(false); // Ocultar y limpiar
                    cargarProductos(); // Recargar la lista al instante con latencia cero
                } else {
                    alert("Error al registrar: " + result.error);
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operación - Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#F3F4F6', // Fondo gris muy claro
                        cardBg: '#FFFFFF', // Tarjetas blancas
                        primary: '#2563EB', // Azul corporativo
                        success: '#16A34A', // Verde agradable
                        textMain: '#1F2937',
                        textMuted: '#6B7280'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-appBg text-textMain font-sans antialiased pb-24">

    <header class="bg-cardBg shadow-sm sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">Operación</h1>
            <button class="text-textMuted hover:text-textMain transition flex items-center gap-1 text-sm font-medium">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <div class="max-w-md mx-auto px-4 mt-6 mb-4 flex bg-gray-200 p-1 rounded-lg">
        <button onclick="cambiarPestaña('ordenes')" id="btn-ordenes" class="flex-1 py-2 bg-white text-primary font-semibold rounded shadow-sm text-sm transition">Órdenes</button>
        <button onclick="cambiarPestaña('productos')" id="btn-productos" class="flex-1 py-2 text-textMuted font-semibold rounded text-sm transition">Catálogo</button>
    </div>

    <main class="max-w-md mx-auto px-4">
        
        <div id="tab-ordenes" class="space-y-4 block">
            
            <div class="bg-cardBg rounded-xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-xs font-semibold text-textMuted uppercase tracking-wider">Ventas de Hoy</p>
                    <p class="text-2xl font-bold text-success mt-1">$0.00</p>
                </div>
                <div class="text-right">
                    <p class="text-xs font-semibold text-textMuted uppercase tracking-wider">Pendientes</p>
                    <p class="text-xl font-bold text-primary mt-1">1 Orden</p>
                </div>
            </div>

            <p class="text-sm font-semibold text-textMuted mt-6 mb-2">POR REVISAR</p>

            <div class="bg-cardBg rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-3">
                    <div>
                        <p class="text-xs font-semibold text-yellow-600 bg-yellow-50 inline-block px-2 py-1 rounded mb-1">Pago por Confirmar</p>
                        <h3 class="font-bold text-lg">#ORD-001</h3>
                    </div>
                    <p class="text-xl font-bold text-textMain">$450.00</p>
                </div>
                
                <div class="space-y-2 mb-4">
                    <div class="flex items-center gap-2 text-sm text-textMuted">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span>Cliente de Prueba</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm text-textMuted">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>Calle Falsa 123...</span>
                    </div>
                </div>
                
                <button class="w-full py-2 mb-4 bg-gray-50 text-textMain rounded-lg border border-gray-200 text-sm font-medium flex justify-center items-center gap-2 hover:bg-gray-100 transition">
                    Ver Comprobante Adjunto
                </button>

                <div class="flex gap-3">
                    <button class="flex-1 py-2.5 bg-success text-white font-semibold rounded-lg text-sm shadow-sm transition">
                        Aprobar
                    </button>
                    <button class="flex-1 py-2.5 bg-white text-red-600 border border-red-200 font-semibold rounded-lg text-sm shadow-sm transition">
                        Rechazar
                    </button>
                </div>
            </div>
        </div>

        <div id="tab-productos" class="space-y-4 hidden">
            
            <button class="w-full py-3 bg-primary text-white font-semibold rounded-xl shadow-sm flex justify-center items-center gap-2 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Registrar Nuevo Producto
            </button>

            <p class="text-sm font-semibold text-textMuted mt-6 mb-2">INVENTARIO ACTUAL</p>

            <div class="bg-cardBg rounded-xl p-3 shadow-sm border border-gray-100 flex gap-4 items-center">
                <div class="w-14 h-14 bg-gray-100 rounded-lg flex-shrink-0 border border-gray-200"></div>
                <div class="flex-grow">
                    <h3 class="font-bold text-textMain text-sm">Playera Básica</h3>
                    <p class="text-sm text-primary font-bold">$250.00</p>
                    <p class="text-xs text-textMuted mt-0.5">Stock total: 15</p>
                </div>
                <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" checked class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-success bg-success right-0"/>
                    <label class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
        </div>
    </main>

    <style>
        .toggle-checkbox:checked { right: 0; border-color: #16A34A; }
        .toggle-checkbox:checked + .toggle-label { background-color: #16A34A; }
        .toggle-checkbox { right: 1.25rem; border-color: #D1D5DB; z-index: 1; }
        .toggle-label { background-color: #D1D5DB; }
    </style>
    <script>
        function cambiarPestaña(pestaña) {
            document.getElementById('tab-ordenes').classList.add('hidden');
            document.getElementById('tab-productos').classList.add('hidden');
            
            document.getElementById('btn-ordenes').className = "flex-1 py-2 text-textMuted font-semibold rounded text-sm transition";
            document.getElementById('btn-productos').className = "flex-1 py-2 text-textMuted font-semibold rounded text-sm transition";
            
            document.getElementById('tab-' + pestaña).classList.remove('hidden');
            document.getElementById('btn-' + pestaña).className = "flex-1 py-2 bg-white text-primary font-semibold rounded shadow-sm text-sm transition";
        }
    </script>
</body>
</html>
